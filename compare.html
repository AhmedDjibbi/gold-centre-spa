<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Side by Side Comparison</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
    }
    .col {
      flex: 1;
      height: 100vh;
      overflow-y: scroll;
      border-right: 2px solid #444;
      position: relative;
    }
    .header {
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.8);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      z-index: 100;
    }
    img {
      width: 100%;
      display: block;
    }
    iframe {
      width: 100%;
      height: 4000px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="col" id="col-ref">
    <div class="header">REFERENCE IMAGE (Gold Centre Spa_ L-Art du Bien-Être.png)</div>
    <img src="/ref_full.png" />
  </div>
  <div class="col" id="col-actual">
    <div class="header">CURRENT REACT IMPLEMENTATION (http://127.0.0.1:5200/)</div>
    <iframe src="/" id="site-frame"></iframe>
  </div>
</body>
</html>
